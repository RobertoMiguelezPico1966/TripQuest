
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tripquest_app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./routes:/var/www/html/routes
    environment:
      APP_NAME: TripQuest
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "${APP_KEY}"
      APP_URL: http://localhost:8000
      SESSION_DRIVER: file
      SESSION_LIFETIME: 120
      SESSION_SECURE_COOKIE: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: tripquest
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: tripquest_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tripquest
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - tripquest_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${DB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  tripquest_data: